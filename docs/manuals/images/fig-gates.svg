<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1051" viewBox="0 0 680 1051" style="font-family:'Segoe UI',Arial,sans-serif"><rect width="680" height="1051" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><text x="340" y="24" text-anchor="middle" font-size="17" font-weight="700" fill="#1f3a5f">The gates before an approval</text><text x="340" y="44" text-anchor="middle" font-size="11.5" fill="#5f6b7a">The server checks them in this order. A refusal skips gates 6 to 8.</text><rect x="40" y="58" width="300" height="30" rx="15" fill="#1f3a5f"/><text x="190" y="78" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">The EO presses Approve</text><line x1="190" y1="88" x2="190" y2="110" stroke="#5f6b7a" stroke-width="1.6" marker-end="url(#a)"/><rect x="40" y="112" width="300" height="53" rx="8" fill="#e6f4ea" stroke="#3d8b5a" stroke-width="1.6"/><circle cx="40" cy="112" r="11" fill="#3d8b5a"/><text x="40" y="116" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text><text x="190" y="132" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d2733">Acknowledged?</text><text x="190" y="148" text-anchor="middle" font-size="10.5" fill="#46515e">the Act's clock must have started</text><line x1="340" y1="138.5" x2="513" y2="138.5" stroke="#b3261e" stroke-width="1.6" marker-end="url(#r)"/><text x="352" y="132.5" font-size="11" font-weight="700" fill="#b3261e">no</text><rect x="515" y="124.5" width="150" height="28" rx="6" fill="#fdecea" stroke="#b3261e" stroke-width="1.4"/><text x="590" y="139.5" text-anchor="middle" font-size="10.5" font-weight="600" fill="#8c1d18">Not acknowledged</text><rect x="40" y="191" width="300" height="67" rx="8" fill="#e6f4ea" stroke="#3d8b5a" stroke-width="1.6"/><circle cx="40" cy="191" r="11" fill="#3d8b5a"/><text x="40" y="195" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><text x="190" y="211" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d2733">Lane open?</text><text x="190" y="227" text-anchor="middle" font-size="10.5" fill="#46515e">a subdivision or rezoning needs the</text><text x="190" y="241" text-anchor="middle" font-size="10.5" fill="#46515e">Minister's instrument (switch S2)</text><line x1="340" y1="224.5" x2="513" y2="224.5" stroke="#b3261e" stroke-width="1.6" marker-end="url(#r)"/><text x="352" y="218.5" font-size="11" font-weight="700" fill="#b3261e">no</text><rect x="515" y="210.5" width="150" height="28" rx="6" fill="#fdecea" stroke="#b3261e" stroke-width="1.4"/><text x="590" y="225.5" text-anchor="middle" font-size="10.5" font-weight="600" fill="#8c1d18">Lane closed</text><line x1="190" y1="165" x2="190" y2="189" stroke="#5f6b7a" stroke-width="1.6" marker-end="url(#a)"/><rect x="40" y="284" width="300" height="53" rx="8" fill="#e6f4ea" stroke="#3d8b5a" stroke-width="1.6"/><circle cx="40" cy="284" r="11" fill="#3d8b5a"/><text x="40" y="288" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text><text x="190" y="304" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d2733">Not yet deemed refused?</text><text x="190" y="320" text-anchor="middle" font-size="10.5" fill="#46515e">counted to any written extension</text><line x1="340" y1="310.5" x2="513" y2="310.5" stroke="#b3261e" stroke-width="1.6" marker-end="url(#r)"/><text x="352" y="304.5" font-size="11" font-weight="700" fill="#b3261e">no</text><rect x="515" y="296.5" width="150" height="28" rx="6" fill="#fdecea" stroke="#b3261e" stroke-width="1.4"/><text x="590" y="311.5" text-anchor="middle" font-size="10.5" font-weight="600" fill="#8c1d18">Deemed refused</text><line x1="190" y1="258" x2="190" y2="282" stroke="#5f6b7a" stroke-width="1.6" marker-end="url(#a)"/><rect x="40" y="363" width="300" height="82" rx="8" fill="#e6f4ea" stroke="#3d8b5a" stroke-width="1.6"/><circle cx="40" cy="363" r="11" fill="#3d8b5a"/><text x="40" y="367" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text><text x="190" y="383" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d2733">Directions checked,</text><text x="190" y="398" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d2733">none binding?</text><text x="190" y="414" text-anchor="middle" font-size="10.5" fill="#46515e">recorded check; no direction that refers</text><text x="190" y="428" text-anchor="middle" font-size="10.5" fill="#46515e">the case to the Minister</text><line x1="340" y1="404" x2="513" y2="404" stroke="#b3261e" stroke-width="1.6" marker-end="url(#r)"/><text x="352" y="398" font-size="11" font-weight="700" fill="#b3261e">no</text><rect x="515" y="383" width="150" height="42" rx="6" fill="#fdecea" stroke="#b3261e" stroke-width="1.4"/><text x="590" y="398" text-anchor="middle" font-size="10.5" font-weight="600" fill="#8c1d18">Direction check required /</text><text x="590" y="412" text-anchor="middle" font-size="10.5" font-weight="600" fill="#8c1d18">A direction applies</text><line x1="190" y1="337" x2="190" y2="361" stroke="#5f6b7a" stroke-width="1.6" marker-end="url(#a)"/><rect x="40" y="471" width="300" height="68" rx="8" fill="#e6f4ea" stroke="#3d8b5a" stroke-width="1.6"/><circle cx="40" cy="471" r="11" fill="#3d8b5a"/><text x="40" y="475" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text><text x="190" y="491" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d2733">No blocking reply</text><text x="190" y="506" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d2733">outstanding?</text><text x="190" y="522" text-anchor="middle" font-size="10.5" fill="#46515e">departments marked "blocking"</text><line x1="340" y1="505" x2="513" y2="505" stroke="#b3261e" stroke-width="1.6" marker-end="url(#r)"/><text x="352" y="499" font-size="11" font-weight="700" fill="#b3261e">no</text><rect x="515" y="491" width="150" height="28" rx="6" fill="#fdecea" stroke="#b3261e" stroke-width="1.4"/><text x="590" y="506" text-anchor="middle" font-size="10.5" font-weight="600" fill="#8c1d18">Blocking reply outstanding</text><line x1="190" y1="445" x2="190" y2="469" stroke="#5f6b7a" stroke-width="1.6" marker-end="url(#a)"/><rect x="40" y="565" width="300" height="82" rx="8" fill="#e6f4ea" stroke="#3d8b5a" stroke-width="1.6"/><circle cx="40" cy="565" r="11" fill="#3d8b5a"/><text x="40" y="569" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">6</text><text x="190" y="585" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d2733">The Act's questions answered,</text><text x="190" y="600" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d2733">referrals made?</text><text x="190" y="616" text-anchor="middle" font-size="10.5" fill="#46515e">road, aerodrome, neighbouring authority,</text><text x="190" y="630" text-anchor="middle" font-size="10.5" fill="#46515e">agriculture, title, adverse use</text><line x1="340" y1="606" x2="513" y2="606" stroke="#b3261e" stroke-width="1.6" marker-end="url(#r)"/><text x="352" y="600" font-size="11" font-weight="700" fill="#b3261e">no</text><rect x="515" y="585" width="150" height="42" rx="6" fill="#fdecea" stroke="#b3261e" stroke-width="1.4"/><text x="590" y="600" text-anchor="middle" font-size="10.5" font-weight="600" fill="#8c1d18">Statutory checks required /</text><text x="590" y="614" text-anchor="middle" font-size="10.5" font-weight="600" fill="#8c1d18">Referral pending</text><line x1="190" y1="539" x2="190" y2="563" stroke="#5f6b7a" stroke-width="1.6" marker-end="url(#a)"/><rect x="40" y="673" width="300" height="82" rx="8" fill="#e6f4ea" stroke="#3d8b5a" stroke-width="1.6"/><circle cx="40" cy="673" r="11" fill="#3d8b5a"/><text x="40" y="677" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">7</text><text x="190" y="693" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d2733">Public notice complete</text><text x="190" y="708" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d2733">(where required)?</text><text x="190" y="724" text-anchor="middle" font-size="10.5" fill="#46515e">s.26(3): advert, owners, site notice,</text><text x="190" y="738" text-anchor="middle" font-size="10.5" fill="#46515e">objection period closed</text><line x1="340" y1="714" x2="513" y2="714" stroke="#b3261e" stroke-width="1.6" marker-end="url(#r)"/><text x="352" y="708" font-size="11" font-weight="700" fill="#b3261e">no</text><rect x="515" y="700" width="150" height="28" rx="6" fill="#fdecea" stroke="#b3261e" stroke-width="1.4"/><text x="590" y="715" text-anchor="middle" font-size="10.5" font-weight="600" fill="#8c1d18">Public notice incomplete</text><line x1="190" y1="647" x2="190" y2="671" stroke="#5f6b7a" stroke-width="1.6" marker-end="url(#a)"/><rect x="40" y="781" width="300" height="67" rx="8" fill="#e6f4ea" stroke="#3d8b5a" stroke-width="1.6"/><circle cx="40" cy="781" r="11" fill="#3d8b5a"/><text x="40" y="785" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">8</text><text x="190" y="801" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d2733">Objections dealt with?</text><text x="190" y="817" text-anchor="middle" font-size="10.5" fill="#46515e">considered, put to the applicant,</text><text x="190" y="831" text-anchor="middle" font-size="10.5" fill="#46515e">14 days used or answered</text><line x1="340" y1="814.5" x2="513" y2="814.5" stroke="#b3261e" stroke-width="1.6" marker-end="url(#r)"/><text x="352" y="808.5" font-size="11" font-weight="700" fill="#b3261e">no</text><rect x="515" y="800.5" width="150" height="28" rx="6" fill="#fdecea" stroke="#b3261e" stroke-width="1.4"/><text x="590" y="815.5" text-anchor="middle" font-size="10.5" font-weight="600" fill="#8c1d18">Objections open</text><line x1="190" y1="755" x2="190" y2="779" stroke="#5f6b7a" stroke-width="1.6" marker-end="url(#a)"/><rect x="40" y="874" width="300" height="81" rx="8" fill="#e6f4ea" stroke="#3d8b5a" stroke-width="1.6"/><circle cx="40" cy="874" r="11" fill="#3d8b5a"/><text x="40" y="878" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">9</text><text x="190" y="894" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d2733">Authority?</text><text x="190" y="910" text-anchor="middle" font-size="10.5" fill="#46515e">a committee resolution that matches the</text><text x="190" y="924" text-anchor="middle" font-size="10.5" fill="#46515e">decision, or the recorded delegation</text><text x="190" y="938" text-anchor="middle" font-size="10.5" fill="#46515e">(S1, S3; S5 to refuse)</text><line x1="340" y1="914.5" x2="513" y2="914.5" stroke="#b3261e" stroke-width="1.6" marker-end="url(#r)"/><text x="352" y="908.5" font-size="11" font-weight="700" fill="#b3261e">no</text><rect x="515" y="893.5" width="150" height="42" rx="6" fill="#fdecea" stroke="#b3261e" stroke-width="1.4"/><text x="590" y="908.5" text-anchor="middle" font-size="10.5" font-weight="600" fill="#8c1d18">Resolution required /</text><text x="590" y="922.5" text-anchor="middle" font-size="10.5" font-weight="600" fill="#8c1d18">Delegation not open</text><line x1="190" y1="848" x2="190" y2="872" stroke="#5f6b7a" stroke-width="1.6" marker-end="url(#a)"/><line x1="190" y1="955" x2="190" y2="979" stroke="#5f6b7a" stroke-width="1.6" marker-end="url(#a)"/><rect x="40" y="981" width="300" height="42" rx="21" fill="#c0485f"/><text x="190" y="999" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">The decision is recorded</text><text x="190" y="1014" text-anchor="middle" font-size="10.5" fill="#fff">with what it rested on; the letter is produced</text><text x="666" y="1041" text-anchor="end" font-size="10" fill="#7b8794">The red boxes are the messages the screen shows</text></svg>