<svg xmlns="http://www.w3.org/2000/svg" width="680" height="770" viewBox="0 0 680 770" style="font-family:'Segoe UI',Arial,sans-serif">
  <rect width="680" height="770" fill="#ffffff"/>
  <text x="340" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1f3a5f">The road of an application</text><rect x="40" y="44" width="150" height="710" fill="#e8f0fe" opacity="0.55"/>
    <rect x="40" y="44" width="150" height="26" fill="#4a78c9"/>
    <text x="115" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Clerk</text><rect x="190" y="44" width="150" height="710" fill="#e6f4ea" opacity="0.55"/>
    <rect x="190" y="44" width="150" height="26" fill="#3d8b5a"/>
    <text x="265" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Planner</text><rect x="340" y="44" width="150" height="710" fill="#fef3e0" opacity="0.55"/>
    <rect x="340" y="44" width="150" height="26" fill="#c98a2b"/>
    <text x="415" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Committee</text><rect x="490" y="44" width="150" height="710" fill="#fde8ec" opacity="0.55"/>
    <rect x="490" y="44" width="150" height="26" fill="#c0485f"/>
    <text x="565" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">EO Planning</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs><path d="M115,113 L115,130 L115,130 L115,145" fill="none" stroke="#5f6b7a" stroke-width="1.6" marker-end="url(#a)"/><path d="M115,193 L115,210 L265,210 L265,225" fill="none" stroke="#5f6b7a" stroke-width="1.6" marker-end="url(#a)"/><path d="M265,273 L265,286 L115,286 L115,297" fill="none" stroke="#5f6b7a" stroke-width="1.6" marker-end="url(#a)"/><path d="M115,361 L115,375 L265,375 L265,387" fill="none" stroke="#5f6b7a" stroke-width="1.6" marker-end="url(#a)"/><path d="M265,451 L265,460 L415,460 L415,467" fill="none" stroke="#5f6b7a" stroke-width="1.6" marker-end="url(#a)"/><path d="M415,531 L415,545 L565,545 L565,557" fill="none" stroke="#5f6b7a" stroke-width="1.6" marker-end="url(#a)"/><path d="M565,621 L565,640 L565,640 L565,657" fill="none" stroke="#5f6b7a" stroke-width="1.6" marker-end="url(#a)"/><rect x="47" y="67" width="136" height="46" rx="7" fill="#fff" stroke="#4a78c9" stroke-width="1.6"/><text x="115" y="85" text-anchor="middle" font-size="11.5" fill="#1d2733">Lodged and registered</text><text x="115" y="101" text-anchor="middle" font-size="11.5" fill="#1d2733">fee paid</text><circle cx="47" cy="67" r="11" fill="#4a78c9"/><text x="47" y="71" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text><rect x="47" y="147" width="136" height="46" rx="7" fill="#fff" stroke="#4a78c9" stroke-width="1.6"/><text x="115" y="165" text-anchor="middle" font-size="11.5" fill="#1d2733">Acknowledged</text><text x="115" y="181" text-anchor="middle" font-size="11.5" fill="#1d2733">the Act's clock starts</text><circle cx="47" cy="147" r="11" fill="#4a78c9"/><text x="47" y="151" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><rect x="197" y="227" width="136" height="46" rx="7" fill="#fff" stroke="#3d8b5a" stroke-width="1.6"/><text x="265" y="245" text-anchor="middle" font-size="11.5" fill="#1d2733">Circulated to</text><text x="265" y="261" text-anchor="middle" font-size="11.5" fill="#1d2733">departments</text><circle cx="197" cy="227" r="11" fill="#3d8b5a"/><text x="197" y="231" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text><rect x="47" y="299" width="136" height="62" rx="7" fill="#fff" stroke="#4a78c9" stroke-width="1.6"/><text x="115" y="317" text-anchor="middle" font-size="11.5" fill="#1d2733">Public notice, if s.26(3)</text><text x="115" y="333" text-anchor="middle" font-size="11.5" fill="#1d2733">objections put to the</text><text x="115" y="349" text-anchor="middle" font-size="11.5" fill="#1d2733">applicant: 14 days</text><circle cx="47" cy="299" r="11" fill="#4a78c9"/><text x="47" y="303" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text><rect x="197" y="389" width="136" height="62" rx="7" fill="#fff" stroke="#3d8b5a" stroke-width="1.6"/><text x="265" y="407" text-anchor="middle" font-size="11.5" fill="#1d2733">Assessed:</text><text x="265" y="423" text-anchor="middle" font-size="11.5" fill="#1d2733">recommendation</text><text x="265" y="439" text-anchor="middle" font-size="11.5" fill="#1d2733">and committee report</text><circle cx="197" cy="389" r="11" fill="#3d8b5a"/><text x="197" y="393" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text><rect x="347" y="469" width="136" height="62" rx="7" fill="#fff" stroke="#c98a2b" stroke-width="1.6"/><text x="415" y="487" text-anchor="middle" font-size="11.5" fill="#1d2733">Committee hears</text><text x="415" y="503" text-anchor="middle" font-size="11.5" fill="#1d2733">the case and</text><text x="415" y="519" text-anchor="middle" font-size="11.5" fill="#1d2733">records a resolution</text><circle cx="347" cy="469" r="11" fill="#c98a2b"/><text x="347" y="473" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">6</text><rect x="497" y="559" width="136" height="62" rx="7" fill="#fff" stroke="#c0485f" stroke-width="3"/><text x="565" y="577" text-anchor="middle" font-size="11.5" fill="#1d2733">EO answers the Act's</text><text x="565" y="593" text-anchor="middle" font-size="11.5" fill="#1d2733">questions, checks</text><text x="565" y="609" text-anchor="middle" font-size="11.5" fill="#1d2733">directions and decides</text><circle cx="497" cy="559" r="11" fill="#c0485f"/><text x="497" y="563" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">7</text><rect x="497" y="659" width="136" height="62" rx="7" fill="#fff" stroke="#c0485f" stroke-width="1.6"/><text x="565" y="677" text-anchor="middle" font-size="11.5" fill="#1d2733">Permit issued,</text><text x="565" y="693" text-anchor="middle" font-size="11.5" fill="#1d2733">applicant notified:</text><text x="565" y="709" text-anchor="middle" font-size="11.5" fill="#1d2733">appeal window 1 month</text><circle cx="497" cy="659" r="11" fill="#c0485f"/><text x="497" y="663" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">8</text><path d="M644,170 L656,170 L656,620 L644,620" fill="none" stroke="#b3261e" stroke-width="2"/><text transform="translate(672,395) rotate(90)" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b3261e">3 months (4 for a subdivision), then deemed refused</text></svg>