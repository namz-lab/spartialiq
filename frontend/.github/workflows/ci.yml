name: CI

# Quality gate for the Vungu planning portal frontend. Before this existed,
# type errors, lint errors and failing tests could all merge freely (review §24).
#
# Jobs are split so a failure names the discipline that broke rather than
# "the build". They run in parallel; `build` is the only one that needs a
# prior step, and it re-runs vue-tsc itself via `npm run build`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  type-check:
    name: Type check (vue-tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # vue-tsc, not tsc: plain tsc reports ~44 spurious "cannot find module
      # *.vue" errors because it does not understand SFC imports.
      - run: npm run type-check

  lint:
    name: Lint (eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # lint:ci, not lint: the `lint` script passes --fix, which would silently
      # rewrite files in CI and report success on problems it repaired.
      # --max-warnings is not set to 0 on purpose: the warn-level rules track
      # existing tech debt (see .eslintrc.cjs), errors are the gate.
      - run: npm run lint:ci

  unit:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # --no-file-parallelism: the suite flakes with "reading 'config'" when
      # files run in parallel workers in this repo.
      - run: npm run test:unit

  e2e:
    name: E2E smoke (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Public surfaces only. Authenticated journeys need seeded test users on a
      # running backend, which CI does not have — see docs/frontend-remediation
      # -report-2026-08.md for the exact blocker rather than a skipped test that
      # pretends to cover them.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
